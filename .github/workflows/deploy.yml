name: Deploy EcoRad to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install from the committed lockfile (pins versions → reproducible). Using `npm install`,
      # not `npm ci`: the lockfile was generated with --package-lock-only and is missing
      # resolved/integrity for some transitive packages, which npm ci rejects. npm install honors
      # the pinned versions and backfills integrity from the registry. To restore strict `npm ci`,
      # regenerate with a full `npm install` on a clean (non-iCloud-corrupted) node_modules.
      - name: Install dependencies
        run: npm install --include=dev
        working-directory: frontend

      - name: Reference tests (calc + model + url)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npx vite build
        working-directory: frontend

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
