name: Deploy EcoRad to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed yet, so npm resolves fresh from package.json (this is
      # what the previously-green builds did). To make installs reproducible, run `npm install`
      # in frontend/ on a machine with registry access, commit the generated package-lock.json,
      # then this can add `cache: npm` to setup-node and switch to `npm ci`.
      - name: Install dependencies
        run: npm install --include=dev
        working-directory: frontend

      - name: Reference tests (calc + model)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npx vite build
        working-directory: frontend

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
