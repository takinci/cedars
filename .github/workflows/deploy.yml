name: Deploy EcoRad to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is committed for reproducible installs. Using `npm install` (not
      # `npm ci`) because the lockfile predates the vitest devDependency; run `npm install`
      # locally once (to add vitest to the lockfile) and this can be tightened to `npm ci`.
      - name: Install dependencies
        run: npm install --include=dev
        working-directory: frontend

      - name: Reference tests (calc.test.js)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npx vite build
        working-directory: frontend

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
